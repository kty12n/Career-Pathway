<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S.T.E.P 진로 경로</title><style>body{margin:0;font:16px Arial;color:#1f2937}header{padding:18px 6%;background:#102a43;color:white;display:flex;gap:24px;align-items:center}.brand{font-size:22px;font-weight:bold}nav{display:flex;gap:18px;flex:1}a{color:inherit;text-decoration:none;cursor:pointer}select{padding:6px}.view{display:none;padding:70px max(6%,30px);min-height:65vh}.view.on{display:block}.home{background:#e9f4ff}h1{font-size:clamp(32px,5vw,58px);color:#102a43;max-width:800px}h2{color:#1976d2}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{padding:20px;border:1px solid #d9e2ec;border-radius:10px;background:#fff}.button{display:inline-block;background:#f6b73c;padding:12px 18px;border-radius:6px;font-weight:bold}@media(max-width:650px){header{flex-wrap:wrap}nav{order:3;flex-basis:100%}.cards{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="#home">S.T.E.P</a><nav><a href="#home" data-k="home">홈</a><a href="#programs" data-k="programs">프로그램</a><a href="#stories" data-k="stories">성공 사례</a><a href="#partners" data-k="partners">파트너</a><a href="#contact" data-k="contact">문의</a></nav><select id="lang"><option value="ko">한국어</option><option value="vi">Tiếng Việt</option><option value="uz">O‘zbekcha</option><option value="en">English</option></select></header><main id="main"></main><script>const T={ko:{home:'홈',programs:'프로그램',stories:'성공 사례',partners:'파트너',contact:'문의',title:'내가 원하는 일을 향한 길을 만드세요.',text:'S.T.E.P는 강점을 발견하고 실제 경험을 쌓아 다음 기회로 나아가도록 돕습니다.',button:'프로그램 살펴보기',sub:'학습자 중심의 진로 경로',story:'작은 걸음이 미래를 만듭니다.',partner:'더 나은 진로 경로는 함께 만듭니다.',contactTitle:'함께 다음 단계로 나아가요.'},en:{home:'Home',programs:'Programs',stories:'Success stories',partners:'Partners',contact:'Contact',title:'Build a pathway to work you believe in.',text:'S.T.E.P helps you discover strengths, gain real-world experience, and move confidently into your next opportunity.',button:'Explore programs',sub:'A learner-centered career pathway',story:'Small steps shape the future.',partner:'Better pathways are built together.',contactTitle:'Let’s take the next step together.'},vi:{home:'Trang chủ',programs:'Chương trình',stories:'Câu chuyện thành công',partners:'Đối tác',contact:'Liên hệ',title:'Xây dựng lộ trình đến công việc bạn tin tưởng.',text:'S.T.E.P giúp bạn khám phá thế mạnh và tích lũy trải nghiệm thực tế.',button:'Khám phá chương trình',sub:'Lộ trình lấy người học làm trung tâm',story:'Những bước nhỏ tạo nên tương lai.',partner:'Lộ trình tốt hơn được xây dựng cùng nhau.',contactTitle:'Cùng nhau bước tiếp.'},uz:{home:'Bosh sahifa',programs:'Dasturlar',stories:'Muvaffaqiyat hikoyalari',partners:'Hamkorlar',contact:'Aloqa',title:'O‘zingiz ishonadigan ish sari yo‘l yarating.',text:'S.T.E.P kuchli tomonlaringizni kashf etish va haqiqiy tajriba olishga yordam beradi.',button:'Dasturlarni ko‘rish',sub:'O‘quvchi markazidagi kasbiy yo‘l',story:'Kichik qadamlar kelajakni yaratadi.',partner:'Yaxshi yo‘llar birgalikda quriladi.',contactTitle:'Keyingi qadamni birga tashlaymiz.'}};let l=localStorage.stepLang||'ko';const m=document.querySelector('#main');function r(){let p=location.hash.slice(1)||'home',x=T[l];document.querySelectorAll('[data-k]').forEach(e=>e.textContent=x[e.dataset.k]);let body=p==='home'?`<section class="view on home"><h1>${x.title}</h1><p>${x.text}</p><a class="button" href="#programs">${x.button}</a></section>`:p==='programs'?`<section class="view on"><h1>${x.sub}</h1><div class="cards"><div class="card"><h2>Skill</h2><p>강점과 관심사 발견</p></div><div class="card"><h2>Train</h2><p>실질적 역량 준비</p></div><div class="card"><h2>Experience</h2><p>프로젝트와 멘토링 경험</p></div><div class="card"><h2>Place</h2><p>나에게 맞는 기회 연결</p></div></div></section>`:p==='stories'?`<section class="view on"><h1>${x.story}</h1><p>${x.text}</p></section>`:p==='partners'?`<section class="view on"><h1>${x.partner}</h1><p>${x.text}</p></section>`:`<section class="view on"><h1>${x.contactTitle}</h1><p>hello@step-pathway.org</p><a class="button" href="mailto:hello@step-pathway.org">Email</a></section>`;m.innerHTML=body;scrollTo(0,0)}document.querySelector('#lang').value=l;document.querySelector('#lang').onchange=e=>{l=e.target.value;localStorage.stepLang=l;r()};onhashchange=r;r();</script></body></html>
