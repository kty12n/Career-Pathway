const app=document.querySelector('#app');function home(){return `<section class="hero"><span class="badge">실무역량과 진로를 위한 통합 성장 플랫폼</span><h1>Career Pathway</h1><p>서정대학교만의 차별화된 프로그램 Career Pathway를 통해 당신의 꿈을 현실로 만드세요.</p><a class="btn" href="#programs">시작하기</a><a class="btn alt" href="#dashboard">현황 보기</a></section><div class="home-body"><div class="intro-grid"><div class="intro"><h2>내일의 꿈을 현실로,<br>서정에서 당신의 미래를 설계하세요</h2><p>서정대학교 Career Pathway는 입학부터 직무 교육, 현장 실습을 거쳐 전문 인력(E-7) 및 지역 정주형(F-2-R) 비자 취득까지 이어지는 체계적인 외국인 유학생 성공 정착 모델을 제시합니다.</p></div><div class="metric"><b>94%</b><span>졸업 후 1년 내 취업률</span></div><div class="metric"><b>25+</b><span>연계 산업체 수</span></div><div class="calendar"><b>전체 교육 기간 (졸업년도 1년)</b><br>총 12개의 정규 과정 및 심화 프로젝트(비교과 프로그램) 200시간</div></div><h2 class="section-title">S.T.E.P Career Pathway</h2><p class="section-sub">Skill → Train → Experience → Place</p><div class="path-cards">${programs.map((p,i)=>`<article class="path" onclick="location.hash='detail-${i}'"><span class="label">${p[0]}</span><h3>${p[1]}</h3><p>${p[2]}</p></article>`).join('')}</div></div>`}
function list(){return `<section class="pagehead"><span class="badge" style="background:#11306E">Programs</span><h1>내일(Job)을 디자인하는 S.T.E.P 프로그램</h1><p>실무 중심의 교육과 현장 경험을 통해 미래 가능성을 현실로 만듭니다.</p></section><div class="content"><div class="filter"><aside class="side"><h3>카테고리</h3><a class="on">전체 프로그램</a>${programs.map((p,i)=>`<a onclick="location.hash='detail-${i}'">${p[0]}</a>`).join('')}<div style="margin-top:24px;border:1px solid var(--line);padding:13px;font-size:11px">맞춤 상담 안내<br><br>전문 취업 컨설턴트가 채용서류 작성과 취업, 정주, Visa 정보를 제공합니다.</div></aside><div><p style="font-size:12px">총 4개의 프로그램이 검색되었습니다.</p><div class="program-grid">${programs.map((p,i)=>`<article class="program"><div class="pic"><span class="label">${p[0]}</span></div><h3>${p[1]}</h3><p>${p[2]}</p><div class="foot">◷ 일정 &nbsp;&nbsp; <a onclick="location.hash='detail-${i}'">상세보기 →</a></div></article>`).join('')}</div></div></div></div>`}
function detail(i){
const info=[

{tag:'Stage 3: Experience',title:'현장 실무 역량 교육',desc:'이론적 지식의 실제 적용을 경험하세요. 현장 실무 역량 교육 프로그램은 학문적 학습과 산업의 요구 사이의 격차를 해소하고, 실무 능력과 전문성을 함양하도록 설계되었습니다.',heading:'프로그램 구조',items:[['현장실습','실제와 유사한 환경에서의 집중적인 실무 교육입니다. 학생들은 각 분야의 실제 과제를 모방하여 설계된 실습에 참여합니다.','20시간'],['인턴십','직접적인 산업 현장 배치, 기존 기업에서 전문 기업 우대 함께 귀중한 경험을 얻습니다.','30시간'],['AI 연계 산학협력 프로젝트','인공지능과 산업별 문제를 결합한 공동 연구 개발 프로젝트입니다. 선도적인 기술 기업과 파트너십을 맺고 혁신적인 솔루션을 개발합니다.','20시간']]},
{tag:'Stage 4: Place',title:'취업연계 현장 교육',desc:'취업연계 현장 교육을 통해 기업 현장을 직접 경험하고 채용시장에서 대한 이해를 높여 진로 및 취업 방향성을 구체화할 수 있는 기회 제공',heading:'취업연계 현장 프로그램',items:[['기업 탐방','체계적인 기업 탐방을 통해 산업현장과 기업문화에 대한 이해를 높이고, 직무 및 진로 탐색 기회를 제공하는 현장 중심의 취업역량 강화 프로그램 운영','기업 탐방 신청 →'],['교내 취업박람회','기업 채용설명회, 현장 면접, 네트워킹 프로그램 운영을 통해 취업 정보 접근성을 높이고 실질적인 취업 기회를 확대하는 맞춤형 취업지원 서비스 제공','참여 기업 보기 →'],['교외 취업박람회','대규모 교외 취업박람회 참가를 통해 다양한 산업 분야의 채용 동향과 기업 정보를 습득하고, 폭넓은 취업 기회를 탐색할 수 있는 현장 중심의 취업지원 제공','지원 요청하기 →']]}
][i];
return `<section class="pagehead"><span class="badge" style="background:#11306E">${info.tag}</span><h1>${info.title}</h1><p>${info.desc}</p><a class="btn" style="background:#11306E;color:#fff" href="#programs">${i===0?'신청하기':i===1?'트랙 신청하기':'상세보기'}</a></section><div class="content"><div class="detail-grid"><section class="modules"><h2>${info.heading}</h2>${info.items.map(x=>`<div class="module"><b>${x[0]}</b><p>${x[1]}</p><small>${x[2]}</small></div>`).join('')}</section><aside><div class="session"><h2>${i===3?'다음 외부 행사':'실습 세션'}</h2><p>${i===3?'2027 Global Talent Fair':'10월 12일 · 모의 면접'}</p><p>${i===3?'오후 1시 · 6일간':'10월 19일 · 현장 교류'}</p><p>${i===3?'참여 기업 및 지원 일정 확인':'10월 26일 · 실무 워크숍'}</p></div><div class="culture"><h3>${i===2?'AI 연계 산학협력 프로젝트':'문화 팁'}</h3><p>${i===2?'인공지능과 산업별 문제를 결합한 공동 연구 개발 프로젝트입니다.':'한국 기업 문화와 직장 예절을 이해하는 실용적인 팁을 제공합니다.'}</p></div></aside></div></div>`}function dashboard(){return `<section class="pagehead"><h1>나의 진로 성장 현황</h1><p>현재 수강 중인 과정과 다음 교육 일정을 확인하세요.</p></section><div class="content"><div class="detail-grid"><div class="modules"><h2>나의 학습 로드맵</h2>${programs.map((p,i)=>`<div class="module"><b>${i<2?'✓ ':'○ '}${p[0]} · ${p[1]}</b><p>${i<2?'수강 완료 또는 진행 중':'다음 단계로 준비 중'}</p></div>`).join('')}</div><aside><div class="session"><h2>다가오는 일정</h2><p>10월 12일 · 모의 면접</p><p>10월 19일 · 기업 탐방</p></div></aside></div></div>`}
function render(){let r=location.hash.slice(1)||'home';document.querySelectorAll('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===r));app.innerHTML=r==='home'?home():r==='programs'?list():r==='dashboard'?dashboard():r.startsWith('detail-')?detail(+r.split('-')[1]):home();scrollTo(0,0)}addEventListener('hashchange',render);render();
